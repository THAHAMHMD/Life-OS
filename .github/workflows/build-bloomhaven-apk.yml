name: Build Bloom Haven APK

on:
  push:
    branches: [ claude/app-build-apk-thgbl8 ]
    paths:
      - 'BloomHaven/**'
      - '.github/workflows/build-bloomhaven-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: BloomHaven
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloom-haven-debug-apk
          path: BloomHaven/app/build/outputs/apk/debug/*.apk

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bloomhaven-apk-${{ github.run_number }}
          name: Bloom Haven debug APK (build ${{ github.run_number }})
          files: BloomHaven/app/build/outputs/apk/debug/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
